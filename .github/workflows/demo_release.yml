name: Build Demo

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Get latest release
        id: latest_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Tag = gh release view --repo ${{ github.repository }} --json tagName -q ".tagName"
          if (-not $Tag) {
            Write-Error "Could not determine latest release tag"
            exit 1
          }
          echo "TAG=$Tag" >> $env:GITHUB_OUTPUT
    
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      - name: Restore NuGet packages
        run: nuget restore NNN-Solution/NNN-Solution.sln

      - name: Build ReleaseDemo
        shell: cmd
        run: |
          msbuild NNN-Solution/NNN-Solution.sln ^
            /p:Configuration=ReleaseDemo ^
            /p:Platform=x64

      - name: Locate build outputs
        id: build
        shell: pwsh
        run: |
          function Get-BuildOutput($filter) {
            $matches = Get-ChildItem "NNN-Solution/NNNDemo" -Recurse -Directory -Filter $filter |
              Where-Object { $_.FullName -notmatch '\\obj\\' }

            if ($matches.Count -eq 0) {
              Write-Error "$filter not found"
              exit 1
            }
            if ($matches.Count -gt 1) {
              Write-Error "Expected exactly one match for $filter, found $($matches.Count): $($matches.FullName -join ', ')"
              exit 1
            }
            return $matches[0].FullName
          }

          $BuildDir = Get-BuildOutput "ReleaseDemo/net10.0/win-x64"

          echo "BUILD_DIR=$BuildDir" >> $env:GITHUB_OUTPUT

      - name: Locate resource directories
        id: resources
        shell: pwsh
        run: |
          $Models = Join-Path $PWD "NNN-Solution\Models"
          $MNIST = Join-Path $PWD "NNN-Solution\TrainingData\MNIST"

          if (-not (Test-Path $Models -PathType Container)) {
            Write-Error "Models directory not found at $Models"
            exit 1
          }

          if (-not (Test-Path $MNIST -PathType Container)) {
            Write-Error "MNIST directory not found at $MNIST"
            exit 1
          }
            
          echo "MODELS=$Models" >> $env:GITHUB_OUTPUT
          echo "MNIST=$MNIST" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          $Version = "${{ steps.latest_release.outputs.TAG }}".TrimStart("v")

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$Version" `
            "/DBuildDir=${{ steps.build.outputs.BUILD_DIR }}" `
            "/DModelsDir=${{ steps.resources.outputs.MODELS }}" `
            "/DMNISTDir=${{ steps.resources.outputs.MNIST }}" `
            "$env:GITHUB_WORKSPACE\installer\NNNDemo.iss"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC.exe failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Update release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.latest_release.outputs.TAG }}
          files: installer/output/NNNDemo-${{ steps.latest_release.outputs.TAG }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
